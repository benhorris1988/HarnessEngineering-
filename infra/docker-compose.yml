services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: harness-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Harness!Pass1"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
      - ../db:/db:ro
    healthcheck:
      test:
        - CMD-SHELL
        - "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Harness!Pass1' -C -No -Q 'SELECT 1' || exit 1"
      interval: 10s
      retries: 12
      start_period: 30s

  ollama:
    image: ollama/ollama:latest
    container_name: harness-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      retries: 6
      start_period: 20s

volumes:
  mssql-data:
  ollama-data:
