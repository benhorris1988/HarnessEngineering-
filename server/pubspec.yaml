name: harness_server
description: Agentic DevOps assistant backend (shelf + MSSQL + Ollama).
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.4.0

dependencies:
  shelf: ^1.4.1
  shelf_router: ^1.1.4
  http: ^1.2.0
  uuid: ^4.3.3
  logging: ^1.2.0
  # Add an MSSQL driver here when wiring up lib/db/mssql_database.dart.
  # Common choices: odbc, tedious_dart. The in-memory fallback works
  # without any driver (run with HARNESS_DB=memory).

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
