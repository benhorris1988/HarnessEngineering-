[project]
name = "harness-server"
version = "0.1.0"
description = "Agentic DevOps assistant backend (FastAPI + uvicorn + MSSQL + Ollama)."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "pyodbc>=5.1",            # MSSQL via ODBC; needs unixODBC + msodbcsql18
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]  # FastAPI uses Depends() defaults

[tool.pytest.ini_options]
asyncio_mode = "auto"
